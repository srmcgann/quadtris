<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
<script type="module">

  import * as Coordinates from
  "https://srmcgann.github.io/Coordinates/coordinates.min.js"

  var rendererOptions = {
    ambientLight: .5, margin: 0,
    fov: 800, width: 1920, height: 1080,
  }
  var renderer = await Coordinates.Renderer(rendererOptions)
  
  var refTexture = 'https://skyboxes2.verymad.net/images/stars2.jpg'
  
  var S = Math.sin
  var C = Math.cos
  var Rn = Math.random
  
  var ctx = Coordinates.Overlay.ctx
  var c   = Coordinates.Overlay.c
  var w   = c.width
  var h   = c.height
  
  var x, y, z, p, q, d
  
  Coordinates.AnimationLoop(renderer, 'Draw')

  var shaderOptions = [
    {lighting: {type: 'ambientLight', value: .5}},
    { uniform: {
      type: 'phong',
      value: .25
    } },
    { uniform: {
      type: 'reflection',
      map: refTexture,
      enabled: false,
      value: .1
    } },
  ]
  var shader = await Coordinates.BasicShader(renderer, shaderOptions)

  var shaderOptions = [
    {lighting: {type: 'ambientLight', value: 1.33}},
    { uniform: {
      type: 'phong',
      value: 0
    } },
    { uniform: {
      type: 'refraction2',
      angleOfRefraction: 1,
      map: refTexture,
      value: .1
    } },
  ]
  var boardShader = await Coordinates.BasicShader(renderer, shaderOptions)

  var shaderOptions = [
    {lighting: {type: 'ambientLight', value: 1}},
    { uniform: {
      type: 'phong',
      value: 0
    } }
  ]
  var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)

  var keyTimerInterval = .5
  var keys = Array(256).fill(false)
  var keyTimers = Array(256).fill(0)
  
  var boardThetaInterval = Math.PI/3
  var boardTheta = 0
  
  var iPc = 100

  const DoKeys = () =>{
    var t = renderer.frameCount / 60
    keys.map((state, key) => {
      if(state){
        switch(key){
          case 65: // a
            if(keyTimers[key] < t){
              boardTheta += Math.PI*2/3
              keyTimers[key] = t + keyTimerInterval
              keys[key] = false
              state = false
            }
          break
          case 68: // d
            if(keyTimers[key] < t){
              boardTheta -= Math.PI*2/3
              keyTimers[key] = t + keyTimerInterval
              keys[key] = false
              state = false
            }
          break
          case 37: // left arrow
            if(keyTimers[key] < t){
              pieces[pieces.length-1].ox -= 2
              keyTimers[key] = t + keyTimerInterval / 2
            }
          break
          case 38: // up arrow
            if(keyTimers[key] < t){
              if(pieces[pieces.length-1].subShape.id != 2){
                var stride = shapes.filter(v=>v.name=='pieces')[0].stride
                var piecesShape = pieces[pieces.length-1].subShape
                var pIdx = pieces.length -1
                for(var i = 0; i < pieces[pIdx].subShape.vertIDs.length; i++){
                  var idx = pieces[pIdx].subShape.vertIDs[i]%stride
                  var x1 = piecesShape.baseVertices[idx + 0] + pieces[pIdx].subShape.x
                  var y1 = piecesShape.baseVertices[idx + 1] + pieces[pIdx].subShape.y
                  p = Math.atan2(x1, y1) - Math.PI/2
                  d = Math.hypot(x1, y1)
                  x = S(p) * d
                  y = C(p) * d
                  
                  piecesShape.baseVertices[idx + 0] = x - pieces[pIdx].x
                  piecesShape.baseVertices[idx + 1] = y - pieces[pIdx].y
                }
                keyTimers[key] = t + keyTimerInterval / 2
              }
            }
          break
          case 39: // right arrow
            if(keyTimers[key] < t){
              pieces[pieces.length-1].ox += 2
              keyTimers[key] = t + keyTimerInterval / 2
            }
          break
          case 40: // down arrow
            if(keyTimers[key] < t){
              pieces[pieces.length-1].oy -= 2
              keyTimers[key] = t + keyTimerInterval / 2
            }
          break
        }
      }
    })
  }

  window.onkeydown = e => {
    console.log(e.keyCode)
    keys[e.keyCode] = true
  }

  window.onkeyup = e => {
    keyTimers[e.keyCode] = 0
    keys[e.keyCode] = false
  }

  var shapes = []
  var pieces = []
  var box    = []

  var geoOptions = {
    shapeType: 'dodecahedron',
    name: 'background',
    sphereize: 1,
    subs: 4,
    map: refTexture,
    size: 5e3,
    colorMix: 0,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    shapes.push(geometry)
    await backgroundShader.ConnectGeometry(geometry)
  })
  
  var pointArray = Array(iPc).fill().map((v,i) => [0,0,0])
  
  var pieceBank = Array(7*iPc).fill().map((v, i) => {
    return{
      id: i%7,
      x: 1e5,
      y: 0,
      z: 0,
      vertIDs: [],
      vertices: [],
    }
  })
  
  var baseShapeVerts
  var geoOptions = {
    shapeType: 'obj',
    url: 'https://srmcgann.github.io/quadtris/tetraminoes.obj?2',
    map: 'https://srmcgann.github.io/quadtris/tetraminoes.png',
    name: 'pieces',
    //disableDepthTest: true,
    scaleX: -1,
    scaleY: 1,
    scaleZ: .25,
    objZ: -.25,
    colorMix: 0,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    await Coordinates.ShapeFromArray(geometry, pointArray).then(async res =>{
      var zSpacing = []
      var sp = .5
      for(var i = 0; i < 7; i ++){
        zSpacing.push((i-3.5)*sp)
      }
      
      for(var i = 0; i < res.stride; i += 9){
        var pcIdx = i/3/iPc/7
        var tgt = -1
        var x1 = res.vertices[i+0]
        var y1 = res.vertices[i+1]
        var z1 = res.vertices[i+2]
        var x2 = res.vertices[i+3]
        var y2 = res.vertices[i+4]
        var z2 = res.vertices[i+5]
        var x3 = res.vertices[i+6]
        var y3 = res.vertices[i+7]
        var z3 = res.vertices[i+8]
        var ax = (x1+x2+x3) / 3
        var ay = (y1+y2+y3) / 3
        var az = (z1+z2+z3) / 3
        var mind = 6e6
        zSpacing.map((v, i) => {
          if((d=Math.abs(v-az)) < mind){
            mind = d
            tgt = i
          }
        })
        if(tgt != -1){
          pieceBank[tgt].z = -zSpacing[tgt]
          for(var m = 0; m < 3; m++){
            pieceBank[tgt].vertIDs.push(i+m*3)
          }
        }
      }
      
      for(var i = 7; i < iPc*7; i++){
        pieceBank[i].x = pieceBank[i%7].x
        pieceBank[i].y = pieceBank[i%7].y
        pieceBank[i].z = pieceBank[i%7].z
        pieceBank[i].vertIDs = structuredClone(pieceBank[i%7].vertIDs).map(v => {
          return v + res.stride * ((i / 7 | 0)-0)
        })
      }
      
      for(var i = 0 ; i < res.vstate.length; i += 3){
        res.vertices[i+0] += 1e5
        res.vertices[i+1] += 0
        res.vertices[i+2] += 0
      }
      shapes.push(res)
      baseShapeVerts = structuredClone(res.vertices.slice(0, res.stride))
      await shader.ConnectGeometry(res)
    })
  })
  
  //pieceBank.map(v=>v.vertices = structuredClone(baseShapeVerts))
  
  
  var geoOptions = {
    shapeType: 'obj',
    url: 'https://srmcgann.github.io/quadtris/board.obj',
    map: 'https://srmcgann.github.io/quadtris/board.png?2',
    name: 'board',
    scaleX: -1.006,
    scaleY: 1.006,
    scaleZ: 1,
    y: 9.55,
    color: 0x000000,
    colorMix: .5,
  }
  if(1) await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    shapes.push(geometry)
    await boardShader.ConnectGeometry(geometry)
 })
  
  
  var geoOptions = {
    shapeType: 'sprite',
    map: 'https://srmcgann.github.io/Coordinates/resources/stars/star1.png',
    name: 'sprite',
    y: 9.5,
    disableDepthTest: true,
    size: 100,
    z: 10,
    alpha: .2,
  }
  if(1)await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    shapes.push(geometry)
  })
 
 
  const SpawnPiece = id => {
    var subShape = pieceBank.filter((pc, idx) => {
      return pc.id == id && pc.x == 1e5
    })
    if(subShape.length){
      subShape[0].vertices = structuredClone(baseShapeVerts)
      subShape[0].baseVertices = structuredClone(baseShapeVerts)
      subShape[0].x = 0
      pieces.push({
        subShape: subShape[0],
        x: -1e5+1,
        y: 0,
        z: subShape[0].z -.2,
        ox: 1,
        oy: 6.4,
        oz: 0,
      })
    }else{
      console.log('no piece generated!')
    }
  }
  
  if(0) Coordinates.LoadFPSControls(renderer, {
    flyMode: true,
    mSpeed: .5,
    crossharSel: 2,
    crosshairSize: .5,
  })
  
  renderer.z = 45
  SpawnPiece(Rn() * 7 | 0)
  //SpawnPiece(2)
  
  window.Draw = () => {
    var t = renderer.t
    
    DoKeys()
    
    renderer.Clear()
    shapes.forEach(shape => {
      switch(shape.name){
        case 'background':
          renderer.Draw(shape)
        break
        case 'pieces':
          /*if(!((t*60|0)%2)){
            pieces.map(piece => {
              // perform checks
              piece.y -= 2
              piece.cy -= 2
            })
          }*/
          pieces.map(piece => {
            piece.subShape.x = piece.x
            piece.subShape.y = piece.y
            piece.subShape.z = piece.z
            for(var j = 0; j < iPc; j++){
              for(var i = 0; i < 7; i++){
                pieceBank[i+j*7].vertIDs.map(idx => {
                  var idx2 = idx % shape.stride
                  shape.vertices[idx + 0] = piece.subShape.baseVertices[idx2 + 0] + pieceBank[i+j*7].x + piece.ox
                  shape.vertices[idx + 1] = piece.subShape.baseVertices[idx2 + 1] + pieceBank[i+j*7].y + piece.oy
                  shape.vertices[idx + 2] = piece.subShape.baseVertices[idx2 + 2] + pieceBank[i+j*7].z + piece.oz
                })
              }
            }
          })
         
          renderer.Draw(shape)
        break
        case 'board':
          if(Math.abs(boardTheta) > .001){
            var theta = boardThetaInterval * (boardTheta > 0 ? -1: 1)
            shape.roll += theta / 6
            boardTheta += theta / 6
          }else{
            boardTheta = 0
          }
          renderer.Draw(shape)
        break
        default:
          renderer.Draw(shape)
        break
      }
    })
  }
  
</script>
  </body>
</html>
