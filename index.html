<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
<script type="module">

  import * as Coordinates from
  "https://srmcgann.github.io/Coordinates/coordinates.min.js"

  var rendererOptions = {
    ambientLight: .5, margin: 0,
    fov: 800, width: 1920, height: 1080,
  }
  var renderer = await Coordinates.Renderer(rendererOptions)
  
  //var refTexture = 'https://skyboxes2.verymad.net/images/stars2.jpg'
  //var refTexture = 'https://skyboxes2.verymad.net/videos/starfield.mp4'
  var refTexture = 'https://srmcgann.github.io/skyboxes2/HDRI/stars.jpg'
  var playbackSpeed = .75
  
  var S = Math.sin
  var C = Math.cos
  var Rn = Math.random
  
  var ctx = Coordinates.Overlay.ctx
  var c   = Coordinates.Overlay.c
  var w   = c.width
  var h   = c.height
  
  var x, y, z, p, q, d
  var showDropLocation = true
  
  Coordinates.AnimationLoop(renderer, 'Draw')

  var shaderOptions = [
    {lighting: {type: 'ambientLight', value: .5}},
    { uniform: {
      type: 'phong',
      value: .25
    } },
    { uniform: {
      type: 'reflection',
      map: refTexture,
      playbackSpeed,
      enabled: false,
      theta: Math.PI/2,
      value: .1
    } },
  ]
  var shader = await Coordinates.BasicShader(renderer, shaderOptions)

  var shaderOptions = [
    {lighting: {type: 'ambientLight', value: .5}},
    { uniform: {
      type: 'phong',
      value: 0
    } },
  ]
  var spriteShader = await Coordinates.BasicShader(renderer, shaderOptions)

  var shaderOptions = [
    {lighting: {type: 'ambientLight', value: 1}},
    { uniform: {
      type: 'phong',
      value: 0
    } },
    { uniform: {
      type: 'refraction2',
      angleOfRefraction: -3,
      map: refTexture,
      playbackSpeed,
      theta: Math.PI/2,
      value: 2
    } },
  ]
  var boardShader = await Coordinates.BasicShader(renderer, shaderOptions)

  var shaderOptions = [
    {lighting: {type: 'ambientLight', value: 1.3}},
    { uniform: {
      type: 'phong',
      value: 0
    } }
  ]
  var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)
  
  const GetPieceCoords = pc => {
    var a = []
    var b = []
    var x, y, z

    while(pc.worldTheta < 0){
      pc.worldTheta += Math.PI*2
    }
    while(pc.worldTheta > Math.PI*2){
      pc.worldTheta -= Math.PI*2
    }
    if(C(pc.worldTheta) > 0){
      pc.subShape.vertIDs.map((v,i) => {
        var idx = v%(pc.subShape.vertIDs.length == 12 ? 252 : 63)
        a.push(
          pc.subShape.baseVertices[idx+0] + pc.x + pc.ox,
          pc.subShape.baseVertices[idx+1] + pc.y + pc.oy,
        )
      })
      for(var i = 0; i < (pc.subShape.vertIDs.length == 12 ? 4 : 1); i ++){
        x = 0
        y = 0
        for(var j = 0; j < 3; j++){
          x += a[i*6+j*2]
          y += a[i*6+j*2+1]
        }
        x /= 3
        y /= 3
        b.push([x,y])
      }
      b = b.map(v=>{
        return v.map((q,j) => {
          return Math.round(q/2+.5)
          //return Math.round(Math.round(q-.01*(j?1:-1))/2+.5)
        })
      })
    }else{
      b = pc.subShape.vertIDs.length == 12 ? [
        [1e5, 1e5],
        [1e5, 1e5],
        [1e5, 1e5],
        [1e5, 1e5],
      ] : [1e5, 1e5]
    }
    return b
  }
  
  
  const RotatePiece = theta => {
    if(pieces[pieces.length-1].subShape.id != 2){
      var stride = shapes.filter(v=>v.name=='pieces')[0].stride
      var piecesShape = pieces[pieces.length-1].subShape
      var pIdx = pieces.length -1
      for(var i = 0; i < pieces[pIdx].subShape.vertIDs.length; i++){
        var idx = pieces[pIdx].subShape.vertIDs[i]%stride
        var x1 = piecesShape.baseVertices[idx + 0] + pieces[pIdx].subShape.x 
        var y1 = piecesShape.baseVertices[idx + 1] + pieces[pIdx].subShape.y
        p = Math.atan2(x1, y1) + theta
        d = Math.hypot(x1, y1)
        x = S(p) * d
        y = C(p) * d
        
        piecesShape.baseVertices[idx + 0] = x - pieces[pIdx].x
        piecesShape.baseVertices[idx + 1] = y - pieces[pIdx].y
      }
      
      var stride = shapes.filter(v=>v.name=='centers')[0].stride
      var centersShape = centers[centers.length-1].subShape
      var pIdx = centers.length -1
      for(var i = 0; i < centers[pIdx].subShape.vertIDs.length; i++){
        var idx = centers[pIdx].subShape.vertIDs[i]%stride
        var x1 = centersShape.baseVertices[idx + 0] + centers[pIdx].x
        var y1 = centersShape.baseVertices[idx + 1] + centers[pIdx].y
        p = Math.atan2(x1, y1) + theta
        d = Math.hypot(x1, y1)
        x = S(p) * d
        y = C(p) * d
        
        centersShape.baseVertices[idx + 0] = x - centers[pIdx].x
        centersShape.baseVertices[idx + 1] = y - centers[pIdx].y
      }
    }
  }
  
  
  
  const Test = dir => {
    var clear = true

    switch(dir){
      case 'left':
        var pc = centers[centers.length-1]
        var b = GetPieceCoords(pc)
        
        var pc = centers[centers.length-1]
        var b = GetPieceCoords(pc)
        for(var i = 0; i < centers.length-1; i ++){
          var chk = GetPieceCoords(centers[i])
          b.map(v1 => {
            chk.map(v2=>{
              if(v1[0] - 1 == v2[0] && v1[1] == v2[1]) clear = false
            })
          })
        }
        b.map(v=>{
          if(v[0] < -3) clear = false
        })
      break
      case 'rotate':
        
        RotatePiece(-Math.PI/2)
        var pc = centers[centers.length-1]
        var b = GetPieceCoords(pc)
        
        // check left
        b.map(v=>{
          if(v[0] < -4) clear = false
        })
        if(!clear){
          clear = true
          pieces[pieces.length-1].ox += 2
          centers[centers.length-1].ox += 2
          pc = centers[centers.length-1]
          b = GetPieceCoords(pc)
          b.map(v=>{
            if(v[0] < -4) clear = false
          })
          if(!clear){
            clear = true
            pieces[pieces.length-1].ox += 2
            centers[centers.length-1].ox += 2
            pc = centers[centers.length-1]
            b = GetPieceCoords(pc)
            for(var i = 0; i < centers.length-1; i ++){
              var chk = GetPieceCoords(centers[i])
              b.map(v1 => {
                chk.map(v2=>{
                  if(v1[0] + 1 == v2[0] && v1[1] == v2[1]) clear = false
                })
              })
            }
            if(!clear){
              pieces[pieces.length-1].ox -= 2
              centers[centers.length-1].ox -= 2
            }
          }
          for(var i = 0; i < centers.length-1; i ++){
            var chk = GetPieceCoords(centers[i])
            b.map(v1 => {
              chk.map(v2=>{
                if(v1[0] + 1 == v2[0] && v1[1] == v2[1]) clear = false
              })
            })
          }
          if(!clear){
            pieces[pieces.length-1].ox -= 2
            centers[centers.length-1].ox -= 2
          }
        }
        for(var i = 0; i < centers.length-1; i ++){
          var chk = GetPieceCoords(centers[i])
          b.map(v1 => {
            chk.map(v2=>{
              if(v1[0] == v2[0] && v1[1] == v2[1]) clear = false
            })
          })
        }
        
        // check right
        b.map(v=>{
          if(v[0] > 5) clear = false
        })
        if(!clear){
          clear = true
          pieces[pieces.length-1].ox -= 2
          centers[centers.length-1].ox -= 2
          pc = centers[centers.length-1]
          b = GetPieceCoords(pc)
          b.map(v=>{
            if(v[0] > 5) clear = false
          })
          if(!clear){
            clear = true
            pieces[pieces.length-1].ox -= 2
            centers[centers.length-1].ox -= 2
            pc = centers[centers.length-1]
            b = GetPieceCoords(pc)
            for(var i = 0; i < centers.length-1; i ++){
              var chk = GetPieceCoords(centers[i])
              b.map(v1 => {
                chk.map(v2=>{
                  if(v1[0] - 1 == v2[0] && v1[1] == v2[1]) clear = false
                })
              })
            }
            if(!clear){
              pieces[pieces.length-1].ox += 2
              centers[centers.length-1].ox += 2
            }
          }
          for(var i = 0; i < centers.length-1; i ++){
            var chk = GetPieceCoords(centers[i])
            b.map(v1 => {
              chk.map(v2=>{
                if(v1[0] - 1 == v2[0] && v1[1] == v2[1]) clear = false
              })
            })
          }
          if(!clear){
            pieces[pieces.length-1].ox += 2
            centers[centers.length-1].ox += 2
          }
        }
        for(var i = 0; i < centers.length-1; i ++){
          var chk = GetPieceCoords(centers[i])
          b.map(v1 => {
            chk.map(v2=>{
              if(v1[0] == v2[0] && v1[1] == v2[1]) clear = false
            })
          })
        }
        
        // check bottom
        b.map(v=>{
          if(v[1] < -22) clear = false
        })
        
        if(!clear) RotatePiece(Math.PI/2)
      break
      case 'right':
        var pc = centers[centers.length-1]
        var b = GetPieceCoords(pc)
        for(var i = 0; i < centers.length-1; i ++){
          var chk = GetPieceCoords(centers[i])
          b.map(v1 => {
            chk.map(v2=>{
              if(v1[0] + 1 == v2[0] && v1[1] == v2[1]) clear = false
            })
          })
        }
        b.map(v=>{
          if(v[0] > 4) clear = false
        })
      break
      case 'down':
        console.log(centers)
        var pc = centers[centers.length-1]
        var b = GetPieceCoords(pc)
        for(var i = 0; i < sampleCenters.length-1; i ++){
          var chk = GetPieceCoords(sampleCenters[i])
          b.map(v1 => {
            chk.map(v2=>{
              if(v1[0] == v2[0] && v1[1] - 1 == v2[1]) clear = false
            })
          })
        }
        b.map(v=>{
          if(v[1] < -22) clear = false
        })
      break
    }
    return clear
  }

  var keyTimerInterval = .5
  var placePieceTimer
  var keys = Array(256).fill(false)
  var keyTimers = Array(256).fill(0)
  
  var boardThetaInterval = Math.PI/3
  var boardTheta = 0
  
  var iPc = 50
  var level = 1

  const SetTexture = (shapeName, url) => {
    var shape = shapes.filter(v=>v.name == shapeName)
    if(shape.length) {
      shape[0].map = url
      shape[0].rebindTextures = true
    }
  }

  const SetRefTexture = (texture, bgLighting=.75) => {
    shapes.map(shape => {
      if(shape.map == refTexture) {
        shape.map = texture
        shape.rebindTextures = true
      }
      shape.shader.datasets.map(ds=>{
        if(ds.iURL == refTexture) {
          ds.iURL = texture
        }
        if(typeof ds.optionalUniforms != 'undefined'){
          if(shape.name == 'background'){
            ds.optionalLighting.map(u => {
              u.value = bgLighting
            })
          }
          ds.optionalUniforms.map(u => {
            if(u.map == refTexture) {
              u.map = texture
              u.rebindTextures = true
            }
          })
        }
      })
    })
    refTexture = texture
  }
  const DoKeys = () =>{
    var t = renderer.frameCount / 60
    keys.map((state, key) => {
      if(state){
        switch(key){
          case 49:
            SetTexture('board', 'https://srmcgann.github.io/quadtris/board_grey.png')
            shapes.filter(v=>v.name=='board')[0].color = 0x101010
          break
          case 50:
            SetTexture('board', 'https://srmcgann.github.io/quadtris/board_green.png')
            shapes.filter(v=>v.name=='board')[0].color = 0x001008
          break
          case 51:
            SetTexture('board', 'https://srmcgann.github.io/quadtris/board_teal.png')
            shapes.filter(v=>v.name=='board')[0].color = 0x001010
          break
          case 52:
            SetTexture('board', 'https://srmcgann.github.io/quadtris/board_purple.png')
            shapes.filter(v=>v.name=='board')[0].color = 0x080010
          break
          case 53:
            SetRefTexture('https://srmcgann.github.io/skyboxes2/HDRI/1.jpg', 1)
          break
          case 54:
            SetRefTexture('https://skyboxes2.verymad.net/images/treehouses.jpg', 1)
          break
          case 55:
            SetRefTexture('https://srmcgann.github.io/skyboxes3/HDRI/skymaze.jpg', 1)
          break
          case 56:
            SetRefTexture('https://srmcgann.github.io/skyboxes7/HDRI/quickgrid.png', 1)
          break
          case 57:
            SetRefTexture('https://srmcgann.github.io/skyboxes3/HDRI/angels.jpg', 1)
          break
          case 48:
            SetRefTexture('https://skyboxes2.verymad.net/images/fantasy1.jpg', 1)
          break
          case 65: // a
            if(keyTimers[key] < t){
              boardTheta += Math.PI*2/3
              keyTimers[key] = t + keyTimerInterval / 1.5
              keys[key] = false
              state = false
            }
          break
          case 68: // d
            if(keyTimers[key] < t){
              boardTheta -= Math.PI*2/3
              keyTimers[key] = t + keyTimerInterval / 1.5
              keys[key] = false
              state = false
            }
          break
          case 32: // space
            if(keyTimers[key] < t){
              while(Test('down')){
                pieces[pieces.length-1].oy -= 2
                centers[centers.length-1].oy -= 2
              }
              
              CheckRows()
              SpawnPiece(Rn() * 7 | 0)
              keyTimers[key] = t + keyTimerInterval * 2
            }
          break
          case 37: // left arrow
            if(keyTimers[key] < t && Test('left')){
              pieces[pieces.length-1].ox -= 2
              centers[centers.length-1].ox -= 2
              keyTimers[key] = t + keyTimerInterval * (t-keyTimers[key] > keyTimerInterval? 1 : .25)
            }
          break
          case 38: // up arrow
            if(keyTimers[key] < t && Test('rotate')){
              keyTimers[key] = t + keyTimerInterval * (t-keyTimers[key] > keyTimerInterval? 1 : .25)
            }
          break
          case 39: // right arrow
            if(keyTimers[key] < t && Test('right')){
              pieces[pieces.length-1].ox += 2
              centers[centers.length-1].ox += 2
              keyTimers[key] = t + keyTimerInterval * (t-keyTimers[key] > keyTimerInterval? 1 : .25)
            }
          break
          case 40: // down arrow
            if(keyTimers[key] < t){
              if(Test('down')){
                pieces[pieces.length-1].oy -= 2
                centers[centers.length-1].oy -= 2
                keyTimers[key] = t + keyTimerInterval * (t-keyTimers[key] > keyTimerInterval? 1 : .1)
              }else{
                if(t-keyTimers[key] > keyTimerInterval){
                  placePieceTimer = t + 30
                }else{
                  if(placePieceTimer < t){
                    CheckRows()
                    SpawnPiece(Rn() * 7 | 0)
                  }
                }
              }
            }
          break
        }
      }
    })
  }

  window.onkeydown = e => {
    console.log(e.keyCode)
    keys[e.keyCode] = true
  }

  window.onkeyup = e => {
    keyTimers[e.keyCode] = 0
    keys[e.keyCode] = false
  }

  var shapes = []
  var pieces = []
  var samples = []
  var dropPiece
  var centers = []
  var sampleCenters = []
  var box    = []

  var geoOptions = {
    shapeType: 'dodecahedron',
    name: 'background',
    playbackSpeed,
    sphereize: 1,
    yaw: Math.PI/2,
    subs: 4,
    map: refTexture,
    size: 5e3,
    colorMix: 0,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    shapes.push(geometry)
    await backgroundShader.ConnectGeometry(geometry)
  })
  
  var pointArray = Array(iPc).fill().map((v,i) => [0,0,0])
  var pieceBank = Array(7*iPc).fill().map((v, i) => {
    return{
      id: i%7,
      x: 1e5,
      y: 0,
      z: 0,
      vertIDs: [],
    }
  })
  
  var sampleBank = Array(7*iPc*4).fill().map((v, i) => {
    return{
      id: i%7,
      x: 1e5,
      y: 0,
      z: 0,
      vertIDs: [],
    }
  })
  
  var centersBank = Array(7*iPc).fill().map((v, i) => {
    return{
      id: i%7,
      x: 1e5,
      y: 0,
      z: 0,
      vertIDs: [],
      vertices: [],
    }
  })
  
  var sampleCentersBank = Array(7*iPc*4).fill().map((v, i) => {
    return{
      id: i%7,
      x: 1e5,
      y: 0,
      z: 0,
      vertIDs: [],
      vertices: [],
    }
  })
  
  var tetraminoTexture = 'https://srmcgann.github.io/quadtris/tetraminoes2.png'
  var baseShapeVerts
  var geoOptions = {
    shapeType: 'obj',
    url: 'https://srmcgann.github.io/quadtris/tetraminoes.obj',
    map: tetraminoTexture,
    name: 'pieces',
    //disableDepthTest: true,
    scaleX: -.95,
    scaleY: -.95,
    scaleZ: .25,
    objZ: -.25,
    colorMix: 0,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    await Coordinates.ShapeFromArray(geometry, pointArray).then(async res =>{
      var zSpacing = []
      var sp = .5
      for(var i = 0; i < 7; i ++){
        zSpacing.push((i-3.5)*sp)
      }
      
      for(var i = 0; i < res.stride; i += 9){
        var pcIdx = i/3/iPc/7
        var tgt = -1
        var x1 = res.vertices[i+0]
        var y1 = res.vertices[i+1]
        var z1 = res.vertices[i+2]
        var x2 = res.vertices[i+3]
        var y2 = res.vertices[i+4]
        var z2 = res.vertices[i+5]
        var x3 = res.vertices[i+6]
        var y3 = res.vertices[i+7]
        var z3 = res.vertices[i+8]
        var ax = (x1+x2+x3) / 3
        var ay = (y1+y2+y3) / 3
        var az = (z1+z2+z3) / 3
        var mind = 6e6
        zSpacing.map((v, i) => {
          if((d=Math.abs(v-az)) < mind){
            mind = d
            tgt = i
          }
        })
        if(tgt != -1){
          pieceBank[tgt].z = -zSpacing[tgt]
          for(var m = 0; m < 3; m++){
            pieceBank[tgt].vertIDs.push(i+m*3)
          }
        }
      }
      
      for(var i = 7; i < iPc*7; i++){
        pieceBank[i].x = pieceBank[i%7].x
        pieceBank[i].y = pieceBank[i%7].y
        pieceBank[i].z = pieceBank[i%7].z
        pieceBank[i].vertIDs = structuredClone(pieceBank[i%7].vertIDs).map(v => {
          return v + res.stride * ((i / 7 | 0)-0)
        })
      }
      
      for(var i = 0 ; i < res.vstate.length; i += 3){
        res.vertices[i+0] += 1e5
        res.vertices[i+1] += 0
        res.vertices[i+2] -= 0
      }
      shapes.push(res)
      baseShapeVerts = structuredClone(res.vertices.slice(0, res.stride))
      await shader.ConnectGeometry(res)
    })
  })
  
  var baseSampleVerts
  var geoOptions = {
    shapeType: 'obj',
    url: 'https://srmcgann.github.io/quadtris/samplePieces.obj',
    map: tetraminoTexture,
    name: 'samples',
    //disableDepthTest: true,
    scaleX: -.95,
    scaleY: -.95,
    scaleZ: .25,
    objZ: -.25,
    colorMix: 0,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    await Coordinates.ShapeFromArray(geometry, pointArray).then(async res =>{
      var zSpacing = []
      var sp = .5
      for(var i = 0; i < 7; i ++){
        zSpacing.push((i-3.5)*sp)
      }
      
      for(var i = 0; i < res.stride; i += 9){
        var pcIdx = i/3/iPc/7
        var tgt = -1
        var x1 = res.vertices[i+0]
        var y1 = res.vertices[i+1]
        var z1 = res.vertices[i+2]
        var x2 = res.vertices[i+3]
        var y2 = res.vertices[i+4]
        var z2 = res.vertices[i+5]
        var x3 = res.vertices[i+6]
        var y3 = res.vertices[i+7]
        var z3 = res.vertices[i+8]
        var ax = (x1+x2+x3) / 3
        var ay = (y1+y2+y3) / 3
        var az = (z1+z2+z3) / 3
        var mind = 6e6
        zSpacing.map((v, i) => {
          if((d=Math.abs(v-az)) < mind){
            mind = d
            tgt = i
          }
        })
        if(tgt != -1){
          sampleBank[tgt].z = -zSpacing[tgt]
          for(var m = 0; m < 3; m++){
            sampleBank[tgt].vertIDs.push(i+m*3)
          }
        }
      }
      
      for(var i = 7; i < iPc*7; i++){
        sampleBank[i].x = sampleBank[i%7].x
        sampleBank[i].y = sampleBank[i%7].y
        sampleBank[i].z = sampleBank[i%7].z
        sampleBank[i].vertIDs = structuredClone(sampleBank[i%7].vertIDs).map(v => {
          return v + res.stride * ((i / 7 | 0)-0)
        })
      }
      
      for(var i = 0 ; i < res.vstate.length; i += 3){
        res.vertices[i+0] += 1e5
        res.vertices[i+1] += 0
        res.vertices[i+2] -= 0
      }
      shapes.push(res)
      baseSampleVerts = structuredClone(res.vertices.slice(0, res.stride))
      await shader.ConnectGeometry(res)
    })
  })
  
  var baseCenterVerts
  var geoOptions = {
    shapeType: 'obj',
    url: 'https://srmcgann.github.io/quadtris/centers.obj',
    name: 'centers',
    scaleX: -.95,
    scaleY: -.95,
    scaleZ: .25,
    objZ: -.25,
  }

        })
      }
    })
    */
  }
  
  var flashes = []
  const SpawnFlash = (x, y, z, life=1, redRate=1) => {
    flashes.push({ x, y, z, life, redRate })
  }
 
  const SpawnSamplePiece = (id, x=0,y=0,z=0) => {
    var subShape = sampleBank.filter((pc, idx) => {
      return pc.id == id && pc.x == 1e5
    })
    if(subShape.length){
      subShape[0].baseVertices = structuredClone(baseSampleVerts)
      subShape[0].x = 0
      samples.push({
        subShape: subShape[0],
        x: -1e5+1,
        y: 0,
        z: subShape[0].z -.2,
        ox: -1 + x,
        oy: 6.25 + y,
        oz: 0 + z,
        ix: -1 + x,
        iy: 6.25 + y,
        iz: 0 + z,
        worldTheta: 0,
      })
    }
  }

  const SpawnSampleCenterPiece = (id, x=0,y=0,z=0) => {
    var subShape = sampleCentersBank.filter((pc, idx) => {
      return pc.id == id && pc.x == 1e5
    })
    if(subShape.length){
      subShape[0].baseVertices = structuredClone(baseSampleCenterVerts)
      subShape[0].x = 0
      sampleCenters.push({
        subShape: subShape[0],
        x: -1e5+1,
        y: 0,
        z: subShape[0].z -.2,
        ox: -1 + x,

        oz: 0 + z,
        ix: -1 + x,
        iy: 6.25 + y,
        iz: 0 + z,
        worldTheta: 0,
      })
    }
  }

  const ReleasePiece = piece => {
    var shape = shapes.filter(v=>v.name=='pieces')[0]
    piece.subShape.x = 1e5    
    var ox = piece.ox
    var oy = piece.oy
    var ix = piece.ix += (piece.ox - piece.ix) / 2
    var iy = piece.iy += (piece.oy - piece.iy) / 2
    p = Math.atan2(ix, iy) + piece.worldTheta
    d = Math.hypot(ix, iy)
    ix = S(p) * d
    iy = C(p) * d
    piece.subShape.vertIDs.map(idx => {
      var idx2 = idx % shape.stride
      x = piece.subShape.baseVertices[idx2 + 0] + piece.subShape.x
      y = piece.subShape.baseVertices[idx2 + 1] + piece.subShape.y - 8
      p = Math.atan2(x, y) + piece.worldTheta
      d = Math.hypot(x, y)
      x = S(p) * d
      y = C(p) * d
      shape.vertices[idx + 0] = x + ix
      shape.vertices[idx + 1] = y + iy + 8
      shape.vertices[idx + 2] = (piece.subShape.baseVertices[idx2 + 2] + piece.subShape.z + piece.oz) * 10 + 2
    })

  }

    center.subShape.x = 1e5

      shape.vertices[idx + 1] = y + iy + 8

    })

    })

        iy: 6.25 + y,

      })

  renderer.z = 52

  window.Draw = () => {
    var t = renderer.frameCount / 60
    
    renderer.yaw = S(t/8)/8
    renderer.pitch = C(t/16)/16
    
    if(!((t*60|0)%(240/(1+level/4)|0))){
      if(Test('down')){
        pieces[pieces.length-1].oy -= 2
        centers[centers.length-1].oy -= 2
      }else{
        CheckRows()
        SpawnPiece(Rn() * 7 | 0)
      }
    }
    
    DoKeys()
    
    renderer.Clear()

      switch(shape.name){

          shape.yaw += C(t/32) / 800

            })
          })
         
          renderer.Draw(shape)
          
          if(showDropLocation){

            while(Test('down')) pc.oy -= 2

            var coords = GetPieceCoords(pc)
            coords.map(v=>{
              x = v[0] * 2 - .85

              ctx.fillRect(ar[0]-s/2,ar[1]-s/2.75,s,s)
            })
          }
          
        break
        case 'centers':
          if(Math.abs(boardTheta) > .001){
            var theta = boardThetaInterval * (boardTheta > 0 ? -1: 1)
            centers.map((v, i) => {
              if(i < centers.length - 1){
                v.worldTheta += theta / 6
              }
            })
          }
        break
        case 'sampleCenters':
          if(Math.abs(boardTheta) > .001){
            var theta = boardThetaInterval * (boardTheta > 0 ? -1: 1)
            centers.map((v, i) => {
              if(i < centers.length - 1){
                v.worldTheta += theta / 6
              }
            })
          }
        break
        case 'flashes':
          flashes = flashes.filter(v=>v.life>0)
          shape.shapeData.map((subShape, sIdx) => {
            if(sIdx < flashes.length){
              for(var i = 0; i < shape.stride; i +=3){
                var idx = sIdx * shape.stride + i
                x = baseFlash[i + 0] * flashes[sIdx].life
                y = baseFlash[i + 1] * flashes[sIdx].life+8
                z = baseFlash[i + 2] * flashes[sIdx].life
                shape.vstate[idx+0] = x + flashes[sIdx].x
                shape.vstate[idx+1] = y + flashes[sIdx].y
                shape.vstate[idx+2] = z + flashes[sIdx].z
                shape.vertices[idx+0] = x + flashes[sIdx].x
                shape.vertices[idx+1] = y + flashes[sIdx].y
                shape.vertices[idx+2] = z + flashes[sIdx].z
              }
              flashes[sIdx].life -= .1 * flashes[sIdx].redRate
            }else{
              for(var i = 0; i < shape.stride; i +=3){
                var idx = sIdx * shape.stride + i
                shape.vstate[idx+0] = 1e5
                shape.vstate[idx+1] = 1e5
                shape.vstate[idx+2] = 1e5
                shape.vertices[idx+0] = 1e5
                shape.vertices[idx+1] = 1e5
                shape.vertices[idx+2] = 1e5
              }
            }
          })
          renderer.Draw(shape)
        break
        case 'board':
          if(Math.abs(boardTheta) > .001){
            var theta = boardThetaInterval * (boardTheta > 0 ? -1: 1)
            shape.roll += theta / 6
            boardTheta += theta / 6
            pieces.map((v, i) => {
              if(i < pieces.length - 1){
                v.worldTheta += theta / 6
              }
            })
          }else{
            boardTheta = 0
          }
          renderer.Draw(shape)
        break
        case 'sprite':
          shape.roll += .003
          renderer.Draw(shape)
        break
        default:
          renderer.Draw(shape)
        break
      }
    })
  }
