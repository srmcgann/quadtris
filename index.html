<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
<script type="module">

  import * as Coordinates from
  "https://srmcgann.github.io/Coordinates/coordinates.min.js"

  var rendererOptions = {
    ambientLight: .5, margin: 0,
    fov: 1500, width: 1920, height: 1080,
  }
  var renderer = await Coordinates.Renderer(rendererOptions)
  
  var refTexture = 'https://skyboxes2.verymad.net/images/stars2.jpg'
  
  var S = Math.sin
  var C = Math.cos
  var Rn = Math.random
  
  var ctx = Coordinates.Overlay.ctx
  var c   = Coordinates.Overlay.c
  var w   = c.width
  var h   = c.height
  
  var x, y, z, p, q, d
  
  Coordinates.AnimationLoop(renderer, 'Draw')

  var shaderOptions = [
    {lighting: {type: 'ambientLight', value: .3}},
    { uniform: {
      type: 'phong',
      value: .25
    } },
    { uniform: {
      type: 'reflection',
      map: refTexture,
      enabled: false,
      value: .1
    } },
  ]
  var shader = await Coordinates.BasicShader(renderer, shaderOptions)

  var shaderOptions = [
    {lighting: {type: 'ambientLight', value: 2}},
    { uniform: {
      type: 'phong',
      value: 0
    } },
    { uniform: {
      type: 'refraction2',
      angleOfRefraction: 1,
      map: refTexture,
      value: .1
    } },
  ]
  var boardShader = await Coordinates.BasicShader(renderer, shaderOptions)

  var shaderOptions = [
    {lighting: {type: 'ambientLight', value: 1}},
    { uniform: {
      type: 'phong',
      value: 0
    } }
  ]
  var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)
  
  const Test = dir => {
    var pc = centers[centers.length-1]
    var a = []
    var x, y, z
    pc.subShape.vertIDs.map((v,i) => {
      a.push(
        pc.subShape.baseVertices[v+0] + pc.x + pc.ox,
        pc.subShape.baseVertices[v+1] + pc.y + pc.oy,
        //pc.subShape.baseVertices[v+2] + pc.z,
      )
    })
    var b = []
    for(var i = 0; i < 4; i ++){
      x = 0
      y = 0
      for(var j = 0; j < 3; j++){
        x += a[i*6+j*2] + .5
        y += a[i*6+j*2+1]
      }
      x /= 3
      y /= 3
      b.push([x,y])
    }
    console.log(b, b.map(v=>{
      return v.map(q=>{
        return Math.round(q)/2
      })
    }))
    switch(dir){
      case 'left':
        console.log(pc)
      break
      case 'rotate':
      break
      case 'right':
      break
      case 'down':
      break
    }
  }

  var keyTimerInterval = .5
  var keys = Array(256).fill(false)
  var keyTimers = Array(256).fill(0)
  
  var boardThetaInterval = Math.PI/3
  var boardTheta = 0
  
  var iPc = 50

  const SetTexture = (shapeName, url) => {
    var shape = shapes.filter(v=>v.name == shapeName)
    if(shape.length) {
      shape[0].map = url
      shape[0].rebindTextures = true
    }
  }

  const DoKeys = () =>{
    var t = renderer.frameCount / 60
    keys.map((state, key) => {
      if(state){
        switch(key){
          case 49:
            SetTexture('board', 'https://srmcgann.github.io/quadtris/board_grey.png')
          break
          case 50:
            SetTexture('board', 'https://srmcgann.github.io/quadtris/board_green.png')
          break
          case 51:
            SetTexture('board', 'https://srmcgann.github.io/quadtris/board_teal.png')
          break
          case 52:
            SetTexture('board', 'https://srmcgann.github.io/quadtris/board_purple.png')
          break
          case 65: // a
            if(keyTimers[key] < t){
              boardTheta += Math.PI*2/3
              keyTimers[key] = t + keyTimerInterval
              keys[key] = false
              state = false
            }
          break
          case 68: // d
            if(keyTimers[key] < t){
              boardTheta -= Math.PI*2/3
              keyTimers[key] = t + keyTimerInterval
              keys[key] = false
              state = false
            }
          break
          case 37: // left arrow
            if(keyTimers[key] < t && Test('left')){
              pieces[pieces.length-1].ox -= 2
              centers[centers.length-1].ox -= 2
              keyTimers[key] = t + keyTimerInterval / 2
            }
          break
          case 38: // up arrow
            if(keyTimers[key] < t){
              if(pieces[pieces.length-1].subShape.id != 2){
                var stride = shapes.filter(v=>v.name=='pieces')[0].stride
                var piecesShape = pieces[pieces.length-1].subShape
                var pIdx = pieces.length -1
                for(var i = 0; i < pieces[pIdx].subShape.vertIDs.length; i++){
                  var idx = pieces[pIdx].subShape.vertIDs[i]%stride
                  var x1 = piecesShape.baseVertices[idx + 0] + pieces[pIdx].subShape.x
                  var y1 = piecesShape.baseVertices[idx + 1] + pieces[pIdx].subShape.y
                  p = Math.atan2(x1, y1) - Math.PI/2
                  d = Math.hypot(x1, y1)
                  x = S(p) * d
                  y = C(p) * d
                  
                  piecesShape.baseVertices[idx + 0] = x - pieces[pIdx].x
                  piecesShape.baseVertices[idx + 1] = y - pieces[pIdx].y
                }
                keyTimers[key] = t + keyTimerInterval / 2
              }
              if(centers[centers.length-1].subShape.id != 2){
                var stride = shapes.filter(v=>v.name=='centers')[0].stride
                var centersShape = centers[centers.length-1].subShape
                var pIdx = centers.length -1
                for(var i = 0; i < centers[pIdx].subShape.vertIDs.length; i++){
                  var idx = centers[pIdx].subShape.vertIDs[i]%stride
                  var x1 = centersShape.baseVertices[idx + 0] + centers[pIdx].subShape.x
                  var y1 = centersShape.baseVertices[idx + 1] + centers[pIdx].subShape.y
                  p = Math.atan2(x1, y1) - Math.PI/2
                  d = Math.hypot(x1, y1)
                  x = S(p) * d
                  y = C(p) * d
                  
                  centersShape.baseVertices[idx + 0] = x - centers[pIdx].x
                  centersShape.baseVertices[idx + 1] = y - centers[pIdx].y
                }
              }
            }
          break
          case 39: // right arrow
            if(keyTimers[key] < t){
              pieces[pieces.length-1].ox += 2
              centers[centers.length-1].ox += 2
              keyTimers[key] = t + keyTimerInterval / 2
            }
          break
          case 40: // down arrow
            if(keyTimers[key] < t){
              pieces[pieces.length-1].oy -= 2
              centers[centers.length-1].oy -= 2
              keyTimers[key] = t + keyTimerInterval / 8
            }
          break
        }
      }
    })
  }

  window.onkeydown = e => {
    console.log(e.keyCode)
    keys[e.keyCode] = true
  }

  window.onkeyup = e => {
    keyTimers[e.keyCode] = 0
    keys[e.keyCode] = false
  }

  var shapes = []
  var pieces = []
  var centers = []
  var box    = []

  var geoOptions = {
    shapeType: 'dodecahedron',
    name: 'background',
    sphereize: 1,
    subs: 4,
    map: refTexture,
    size: 5e3,
    colorMix: 0,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    shapes.push(geometry)
    await backgroundShader.ConnectGeometry(geometry)
  })
  
  var pointArray = Array(iPc).fill().map((v,i) => [0,0,0])
  
  var pieceBank = Array(7*iPc).fill().map((v, i) => {
    return{
      id: i%7,
      x: 1e5,
      y: 0,
      z: 0,
      vertIDs: [],
      vertices: [],
    }
  })
  
  var centersBank = Array(7*iPc).fill().map((v, i) => {
    return{
      id: i%7,
      x: 1e5,
      y: 0,
      z: 0,
      vertIDs: [],
      vertices: [],
    }
  })
  
  var baseShapeVerts
  var geoOptions = {
    shapeType: 'obj',
    url: 'https://srmcgann.github.io/quadtris/tetraminoes.obj?2',
    map: 'https://srmcgann.github.io/quadtris/tetraminoes.png?2',
    name: 'pieces',
    //disableDepthTest: true,
    scaleX: -.95,
    scaleY: -.95,
    scaleZ: .25,
    objZ: -.25,
    colorMix: 0,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    await Coordinates.ShapeFromArray(geometry, pointArray).then(async res =>{
      var zSpacing = []
      var sp = .5
      for(var i = 0; i < 7; i ++){
        zSpacing.push((i-3.5)*sp)
      }
      
      for(var i = 0; i < res.stride; i += 9){
        var pcIdx = i/3/iPc/7
        var tgt = -1
        var x1 = res.vertices[i+0]
        var y1 = res.vertices[i+1]
        var z1 = res.vertices[i+2]
        var x2 = res.vertices[i+3]
        var y2 = res.vertices[i+4]
        var z2 = res.vertices[i+5]
        var x3 = res.vertices[i+6]
        var y3 = res.vertices[i+7]
        var z3 = res.vertices[i+8]
        var ax = (x1+x2+x3) / 3
        var ay = (y1+y2+y3) / 3
        var az = (z1+z2+z3) / 3
        var mind = 6e6
        zSpacing.map((v, i) => {
          if((d=Math.abs(v-az)) < mind){
            mind = d
            tgt = i
          }
        })
        if(tgt != -1){
          pieceBank[tgt].z = -zSpacing[tgt]
          for(var m = 0; m < 3; m++){
            pieceBank[tgt].vertIDs.push(i+m*3)
          }
        }
      }
      
      for(var i = 7; i < iPc*7; i++){
        pieceBank[i].x = pieceBank[i%7].x
        pieceBank[i].y = pieceBank[i%7].y
        pieceBank[i].z = pieceBank[i%7].z
        pieceBank[i].vertIDs = structuredClone(pieceBank[i%7].vertIDs).map(v => {
          return v + res.stride * ((i / 7 | 0)-0)
        })
      }
      
      for(var i = 0 ; i < res.vstate.length; i += 3){
        res.vertices[i+0] += 1e5
        res.vertices[i+1] += 0
        res.vertices[i+2] -= 0
      }
      shapes.push(res)
      baseShapeVerts = structuredClone(res.vertices.slice(0, res.stride))
      await shader.ConnectGeometry(res)
    })
  })
  
  var baseCenterVerts
  var geoOptions = {
    shapeType: 'obj',
    url: 'https://srmcgann.github.io/quadtris/centers.obj',
    name: 'centers',
    scaleX: -.95,
    scaleY: -.95,
    scaleZ: .25,
    objZ: -.25,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    await Coordinates.ShapeFromArray(geometry, pointArray).then(async res =>{
      var zSpacing = []
      var sp = .5
      for(var i = 0; i < 7; i ++){
        zSpacing.push((i-3.5)*sp)
      }
      
      for(var i = 0; i < res.stride; i += 9){
        var pcIdx = i/3/iPc/7
        var tgt = -1
        var x1 = res.vertices[i+0]
        var y1 = res.vertices[i+1]
        var z1 = res.vertices[i+2]
        var x2 = res.vertices[i+3]
        var y2 = res.vertices[i+4]
        var z2 = res.vertices[i+5]
        var x3 = res.vertices[i+6]
        var y3 = res.vertices[i+7]
        var z3 = res.vertices[i+8]
        var ax = (x1+x2+x3) / 3
        var ay = (y1+y2+y3) / 3
        var az = (z1+z2+z3) / 3
        var mind = 6e6
        zSpacing.map((v, i) => {
          if((d=Math.abs(v-az)) < mind){
            mind = d
            tgt = i
          }
        })
        if(tgt != -1){
          centersBank[tgt].z = -zSpacing[tgt]
          for(var m = 0; m < 3; m++){
            centersBank[tgt].vertIDs.push(i+m*3)
          }
        }
      }
      
      for(var i = 7; i < iPc*7; i++){
        centersBank[i].x = centersBank[i%7].x
        centersBank[i].y = centersBank[i%7].y
        centersBank[i].z = centersBank[i%7].z
        centersBank[i].vertIDs = structuredClone(centersBank[i%7].vertIDs).map(v => {
          return v + res.stride * ((i / 7 | 0)-0)
        })
      }
      
      for(var i = 0 ; i < res.vstate.length; i += 3){
        res.vertices[i+0] += 1e5
        res.vertices[i+1] += 0
        res.vertices[i+2] -= 0
      }
      shapes.push(res)
      baseCenterVerts = structuredClone(res.vertices.slice(0, res.stride))
    })
  })
  
  
  var geoOptions = {
    shapeType: 'obj',
    url: 'https://srmcgann.github.io/quadtris/board.obj',
    map: 'https://srmcgann.github.io/quadtris/board_purple.png',
    name: 'board',
    cullFace: 'back',
    //disableDepthTest: true,
    //alpha: .5,
    scaleX: -1.006,
    scaleY: 1.006,
    scaleZ: .25,
    y: 9,
    color: 0x000000,
    colorMix: .75,
  }
  if(1) await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    for(var i = 0; i < geometry.vertices.length; i+=3){
      geometry.vertices[i+0] += 0
      geometry.vertices[i+1] += 0
      geometry.vertices[i+2] += 0
    }
    shapes.push(geometry)
    await boardShader.ConnectGeometry(geometry)
 })
  
  
  var geoOptions = {
    shapeType: 'sprite',
    map: 'https://srmcgann.github.io/Coordinates/resources/stars/star1.png',
    name: 'sprite',
    y: 9.5,
    disableDepthTest: true,
    size: 100,
    z: 10,
    alpha: .2,
  }
  if(1)await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    shapes.push(geometry)
  })
 
 
  const SpawnPiece = (id, x=0,y=0,z=0) => {
  
    // pieces
    var subShape = pieceBank.filter((pc, idx) => {
      return pc.id == id && pc.x == 1e5
    })
    if(subShape.length){
      subShape[0].vertices = structuredClone(baseShapeVerts)
      subShape[0].baseVertices = structuredClone(baseShapeVerts)
      subShape[0].x = 0
      pieces.push({
        subShape: subShape[0],
        x: -1e5+1,
        y: 0,
        z: subShape[0].z -.2,
        ox: -1 + x,
        oy: 6.25 + y,
        oz: 0 + z,
      })
    }
  
    // centers
    var subShape = centersBank.filter((pc, idx) => {
      return pc.id == id && pc.x == 1e5
    })
    if(subShape.length){
      subShape[0].vertices = structuredClone(baseCenterVerts)
      subShape[0].baseVertices = structuredClone(baseCenterVerts)
      subShape[0].x = 0
      centers.push({
        subShape: subShape[0],
        x: -1e5+1,
        y: 0,
        z: subShape[0].z -.2,
        ox: -1 + x,
        oy: 6.25 + y,
        oz: 0 + z,
      })
    }else{
      console.log('no piece generated!')
    }
  }
  
  if(0) Coordinates.LoadFPSControls(renderer, {
    flyMode: true,
    mSpeed: .5,
    crossharSel: 2,
    crosshairSize: .5,
  })
  
  renderer.z = 45
  SpawnPiece(Rn() * 7 | 0, -2*3, -52)
  SpawnPiece(Rn() * 7 | 0, 2*4, -52)
  SpawnPiece(Rn() * 7 | 0)
  //SpawnPiece(Rn() * 7 | 0)
  //SpawnPiece(Rn() * 7 | 0)
  //SpawnPiece(5)
  
  window.Draw = () => {
    var t = renderer.t
    
    DoKeys()
    
    renderer.Clear()
    shapes.forEach(shape => {
      switch(shape.name){
        case 'background':
          renderer.Draw(shape)
        break
        case 'pieces':
          pieces.map(piece => {
            piece.subShape.x = piece.x
            piece.subShape.y = piece.y
            piece.subShape.z = piece.z
            piece.subShape.vertIDs.map(idx => {
              var idx2 = idx % shape.stride
              shape.vertices[idx + 0] = piece.subShape.baseVertices[idx2 + 0] + piece.subShape.x + piece.ox
              shape.vertices[idx + 1] = piece.subShape.baseVertices[idx2 + 1] + piece.subShape.y + piece.oy
              shape.vertices[idx + 2] = piece.subShape.baseVertices[idx2 + 2] + piece.subShape.z + piece.oz
            })
          })
         
          renderer.Draw(shape)
        break
        case 'centers':
        break
        case 'board':
          if(Math.abs(boardTheta) > .001){
            var theta = boardThetaInterval * (boardTheta > 0 ? -1: 1)
            shape.roll += theta / 6
            boardTheta += theta / 6
          }else{
            boardTheta = 0
          }
          renderer.Draw(shape)
        break
        default:
          renderer.Draw(shape)
        break
      }
    })
  }
  
</script>
  </body>
</html>
