<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
<script type="module">

  import * as Coordinates from
  "https://srmcgann.github.io/Coordinates/coordinates.min.js"

  var rendererOptions = {
    ambientLight: .5, margin: 0,
    fov: 1e3, width: 1920, height: 1080,
    //fov: 1e3/2, width: 1920/2, height: 1080/2,
    // uncomment above for lower-res, higher-performance canvas
  }
  var renderer = await Coordinates.Renderer(rendererOptions)
  
  var refTexture = 'https://skyboxes2.verymad.net/images/stars2.jpg'
  
  var S = Math.sin
  var C = Math.cos
  var Rn = Math.random
  
  var ctx = Coordinates.Overlay.ctx
  var c   = Coordinates.Overlay.c
  var w   = c.width
  var h   = c.height
  
  var x, y, z, p, q, d
  
  Coordinates.AnimationLoop(renderer, 'Draw')

  var shaderOptions = [
    {lighting: {type: 'ambientLight', value: .5}},
    { uniform: {
      type: 'phong',
      value: .25
    } },
    { uniform: {
      type: 'reflection',
      map: refTexture,
      enabled: false,
      value: .1
    } },
  ]
  var shader = await Coordinates.BasicShader(renderer, shaderOptions)

  var shaderOptions = [
    {lighting: {type: 'ambientLight', value: 1.33}},
    { uniform: {
      type: 'phong',
      value: 0
    } },
    { uniform: {
      type: 'refraction2',
      angleOfRefraction: 1,
      map: refTexture,
      value: .1
    } },
  ]
  var boardShader = await Coordinates.BasicShader(renderer, shaderOptions)

  var shaderOptions = [
    {lighting: {type: 'ambientLight', value: 1}},
    { uniform: {
      type: 'phong',
      value: 0
    } }
  ]
  var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)

  var keyTimerInterval = .5
  var keys = Array(256).fill(false)
  var keyTimers = Array(256).fill(0)
  
  var boardThetaInterval = Math.PI/3
  var boardTheta = 0
  
  var cl = 1
  var rw = 1
  var br = 30
  var sp = 0
  var pieceBank = Array(7*cl*rw*br).fill().map((v, i) => {
    return{
      id: i%7,
      x: 0,
      y: 0,
      z: 0,
    }
  })
  
  const DoKeys = () =>{
    var t = renderer.frameCount / 60
    keys.map((state, key) => {
      if(state){
        switch(key){
          case 65: // a
            if(keyTimers[key] < t){
              boardTheta += Math.PI*4/3
              keyTimers[key] = t + keyTimerInterval
            }
          break
          case 68: // d
            if(keyTimers[key] < t){
              boardTheta -= Math.PI*4/3
              keyTimers[key] = t + keyTimerInterval
            }
          break
          case 37: // left arrow
          break
          case 38: // up arrow
          break
          case 39: // right arrow
          break
          case 40: // down arrow
          break
        }
      }
    })
  }

  window.onkeydown = e => {
    console.log(e.keyCode)
    keys[e.keyCode] = true
  }

  window.onkeyup = e => {
    keyTimers[e.keyCode] = 0
    keys[e.keyCode] = false
  }

  var shapes = []

  var geoOptions = {
    shapeType: 'dodecahedron',
    name: 'background',
    sphereize: 1,
    subs: 4,
    map: refTexture,
    size: 5e3,
    colorMix: 0,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    shapes.push(geometry)
    await backgroundShader.ConnectGeometry(geometry)
  })
  
  var pointArray = []
  Array(cl*rw*br).fill().map((v,i) => {
    x = ((i%cl)-cl/2+.5) * sp
    y = (((i/cl|0)%rw)-rw/2 + .5) * sp
    z = ((i/cl/rw|0)-br/2 + .5) * sp
    pointArray.push([x,y,z])
  })
  
  var geoOptions = {
    shapeType: 'obj',
    url: 'https://srmcgann.github.io/quadtris/tetraminoes.obj',
    map: 'https://srmcgann.github.io/quadtris/tetraminoes.png',
    name: 'pieces',
    scaleX: -1,
    scaleY: 1,
    scaleZ: .25,
    objZ: -.25,
    colorMix: 0,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    Coordinates.ShapeFromArray(geometry, pointArray).then(async res =>{
      res.shapeData.map((subShape, sIdx) => {
        var pid = sIdx%7
        var ox, oy, oz
        switch(pid){
          case 0:
            //x = -30, y = 0, z = 0;
            //ox = 23.25, oy = 10, oz = 0;
            x = -30, y = 0, z = 0;
            ox = 10.75*2.1575, oy = 0, oz = .00125;
          break
          case 1:
            x = -20, y = 0, z = 0;
            ox = 16, oy = 0, oz = 0;
          break
          case 2:
            x = -10, y = 0, z = 0;
            ox = 10, oy = 0, oz = -.0025;
          break
          case 3:
            x = 0, y = 0, z = 0;
            ox = 0, oy = 0, oz = 0;
          break
          case 4:
            x = 10, y = 0, z = 0;
            ox = -10, oy = 0, oz = -.004;
          break
          case 5:
            x = 20, y = 0, z = 0;
            ox = -21, oy = 0, oz = -.006;
          break
          case 6:
            x = 30, y = 0, z = 0;
            ox = -31, oy = 0, oz = -.007;
          break
        }
        var pIdx = sIdx + pid
        pieceBank[pIdx].x = x
        pieceBank[pIdx].y = y
        pieceBank[pIdx].z = z
        pieceBank[pIdx].ox = ox
        pieceBank[pIdx].oy = oy
        pieceBank[pIdx].oz = oz
        
        var ls = 9
        var coords = []
        for(var i = 0; i < 4; i ++){
          coords.push([
            pieceBank[pIdx].x + S(p=Math.PI*2/4*i+Math.PI/4) * ls,
            pieceBank[pIdx].y + C(p) * ls
          ])
        }
        
        var l1,l2,l3,l4
        var oIdx = 2
        var mag = .25
        for(var i = 0 ; i < res.vstate.length; i += 3){
          x = res.vstate[i+0]
          y = res.vstate[i+1]
          z = res.vstate[i+2]
          if(x > coords[l1=(oIdx+0)%4][0] && y > coords[l1][1] &&
             x > coords[l2=(oIdx+1)%4][0] && y < coords[l2][1] &&
             x < coords[l3=(oIdx+2)%4][0] && y < coords[l3][1] &&
             x < coords[l4=(oIdx+3)%4][0] && y > coords[l4][1]){
            //res.vstate[i+0] += pieceBank[sIdx].ox*mag
            //res.vstate[i+1] += pieceBank[sIdx].oy*mag
            //res.vstate[i+2] += pieceBank[sIdx].oz*mag
            res.vertices[i+0] += pieceBank[pIdx].ox*mag
            res.vertices[i+1] += pieceBank[pIdx].oy*mag
            res.vertices[i+2] += pieceBank[pIdx].oz*mag
          }
        }
      })
      shapes.push(res)
      await shader.ConnectGeometry(res)
    })
  })
  
  
  var geoOptions = {
    shapeType: 'obj',
    url: 'https://srmcgann.github.io/quadtris/board.obj',
    map: 'https://srmcgann.github.io/quadtris/board.png',
    name: 'board',
    scaleX: -1,
    scaleY: 1,
    scaleZ: 1,
    y: 9.5,
    color: 0x000000,
    colorMix: .75,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    shapes.push(geometry)
    await boardShader.ConnectGeometry(geometry)
 })
  
  
  var geoOptions = {
    shapeType: 'sprite',
    map: 'https://srmcgann.github.io/Coordinates/resources/stars/star1.png',
    name: 'board',
    y: 9.5,
    disableDepthTest: true,
    size: 100,
    z: 10,
    alpha: .2,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    shapes.push(geometry)
    await boardShader.ConnectGeometry(geometry)
 })
  
  
  if(0) Coordinates.LoadFPSControls(renderer, {
    flyMode: true,
    mSpeed: .5,
    crossharSel: 2,
    crosshairSize: .5,
  })
  
  renderer.z = 20
  
  window.Draw = () => {
    var t = renderer.t
    
    DoKeys()
    
    renderer.Clear()
    shapes.forEach(shape => {
      switch(shape.name){
        case 'background':
          renderer.Draw(shape)
        break
        case 'pieces':
          renderer.Draw(shape)
        break
        case 'board':
          if(Math.abs(boardTheta) > .001){
            var theta = boardThetaInterval * (boardTheta > 0 ? -1: 1)
            shape.roll += theta / 6
            boardTheta += theta / 6
          }else{
            boardTheta = 0
          }
          renderer.Draw(shape)
        break
        default:
          renderer.Draw(shape)
        break
      }
    })
    
    
    ctx.clearRect(0,0,w,h)
    ctx.strokeStyle = 'red'
    pieceBank.map((piece, pIdx) => {
      x = piece.x + piece.ox
      y = piece.y + piece.oy
      z = piece.z + piece.oz
      var coords = Coordinates.GetShaderCoord(x,y,z,{
        x: 0,
        y: 0,
        z: 0,
        roll: 0,
        pitch: 0,
        yaw: 0,
      }, renderer)
      if(coords){
        ctx.beginPath()
        for(var i = 0; i < 4; i ++){
          x = coords[0] + S(p = Math.PI*2/4*i+Math.PI/4) * 75
          y = coords[1] + C(p) * 75
          ctx.lineTo(x, y)
        }
        ctx.closePath()
        //ctx.stroke()
      }
    })
  }
  
</script>
  </body>
</html>
